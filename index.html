    function isYandexBrowser() {
        // Проверяем наличие специфичных для Яндекса свойств

               window.navigator.vendor === 'Yandex' ||

        // ========== АВТОМАТИЧЕСКОЕ ОПРЕДЕЛЕНИЕ НЕДЕЛИ ==========
        function getCurrentWeekType() {
            const startDate = new Date('2024-09-02');
            const now = new Date();
            
            const diffMs = now - startDate;
            
            if (diffMs < 0) {
                return 'numerator';
            }
            
            const diffWeeks = Math.floor(diffMs / (1000 * 60 * 60 * 24 * 7));
            return (diffWeeks % 2 === 0) ? 'numerator' : 'denominator';
        }

            const lessons = scheduleData[weekType][dayIndex.toString()];
            const weekClassName = weekType === 'numerator' ? 'week-numerator' : 'week-denominator';
            const weekName = weekType === 'numerator' ? 'ЧИСЛИТЕЛЬ' : 'ЗНАМЕНАТЕЛЬ';
            
            currentInfoDiv.innerHTML = `
                <div style="font-weight: 600; color: #d63384;">${dayNames[dayIndex]}</div>
                <div style="margin-top: 4px; font-size: 0.9em;">
                    Неделя: <span class="week-indicator ${weekClassName}">${weekName}</span>
                </div>
            `;

            if (!lessons || lessons.length === 0) {
                scheduleDiv.innerHTML = '<p class="no-lessons">🎓 Занятий нет</p>';
                return;
            }

            // Для мобильных устройств - компактная версия
            if (window.innerWidth <= 768) {
                let compactHTML = '<div class="compact-table">';
                
                lessons.forEach(lesson => {
                    const typeClass = getTypeClass(lesson.type);
                    compactHTML += `
                        <div class="compact-row">
                            <div class="compact-time">${lesson.time}</div>
                            <div class="compact-subject">${lesson.subject}</div>
                            <div class="compact-details">
                                <span class="compact-type ${typeClass}">${lesson.type}</span>
                                <span class="compact-teacher">${lesson.teacher}</span>
                                <span class="compact-room">Каб. ${lesson.room}</span>
                            </div>
                        </div>
                    `;
                });
                
                compactHTML += '</div>';
                scheduleDiv.innerHTML = compactHTML;
            } else {
                // Для десктопа - полная таблица
                let tableHTML = `
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th class="time-col">Время</th>
                                <th class="subject-col">Предмет</th>
                                <th class="type-col">Тип</th>
                                <th class="teacher-col">Преподаватель</th>
                                <th class="room-col">Кабинет</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                lessons.forEach(lesson => {
                    const typeClass = getTypeClass(lesson.type);
                    tableHTML += `
                        <tr>
                            <td class="time-col">${lesson.time}</td>
                            <td class="subject-col">${lesson.subject}</td>
                            <td class="type-col">
                                <span class="lesson-type ${typeClass}">${lesson.type}</span>
                            </td>
                            <td class="teacher-col">${lesson.teacher}</td>
                            <td class="room-col">${lesson.room}</td>
                        </tr>
                    `;
                });

                tableHTML += '</tbody></table>';
                scheduleDiv.innerHTML = tableHTML;
            }
        }

        // Функция отрисовки полного расписания на неделю
        function renderFullWeekSchedule() {
            const scheduleDiv = document.getElementById('schedule');
            const currentInfoDiv = document.querySelector('.current-info');
            const weekType = getCurrentWeekType();
            
            const weekClassName = weekType === 'numerator' ? 'week-numerator' : 'week-denominator';
            const weekName = weekType === 'numerator' ? 'ЧИСЛИТЕЛЬ' : 'ЗНАМЕНАТЕЛЬ';
            
            currentInfoDiv.innerHTML = `
                <div style="font-weight: 600; color: #d63384;">Расписание на неделю</div>
                <div style="margin-top: 4px; font-size: 0.9em;">
                    Неделя: <span class="week-indicator ${weekClassName}">${weekName}</span>
                </div>
            `;

            let weekHTML = '<div class="full-week-title">📅 Полное расписание на неделю</div>';

            for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
                const lessons = scheduleData[weekType][dayIndex.toString()];
                const dayName = dayNames[dayIndex];
                const isToday = dayIndex === currentDayOfWeek;
                
                weekHTML += `
                    <div class="day-schedule">
                        <div class="day-header">
                            <span>${dayName}${isToday ? ' 🌟' : ''}</span>
                            <span class="week-indicator ${weekClassName}" style="font-size: 0.8em;">${weekName}</span>
                        </div>
                        <div class="day-lessons">
                `;
                
                if (!lessons || lessons.length === 0) {
                    weekHTML += '<div style="padding: 10px; color: #b8a2b9; text-align: center; font-style: italic; font-size: 0.9em;">Занятий нет</div>';
                } else {
                    lessons.forEach(lesson => {
                        const typeClass = getTypeClass(lesson.type);
                        weekHTML += `
                            <div class="lesson-item">
                                <div class="lesson-time">${lesson.time}</div>
                                <div class="lesson-subject">${lesson.subject}</div>
                                <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;">
                                    <span class="lesson-type ${typeClass}">${lesson.type}</span>
                                    <span class="lesson-teacher">${lesson.teacher}</span>
                                    <span class="lesson-room">Каб. ${lesson.room}</span>
                                </div>
                            </div>
                        `;
                    });
                }
                
                weekHTML += `
                        </div>
                    </div>
                `;
            }

            weekHTML += `
                <button class="back-btn" id="backToTodayBtn">
                    ← Вернуться к сегодняшнему дню
                </button>
            `;

            scheduleDiv.innerHTML = weekHTML;
            
            document.getElementById('backToTodayBtn').addEventListener('click', function() {
                const activeDayBtn = document.querySelector(`.day-btn[data-day="${currentDayOfWeek}"]`);
                if (activeDayBtn) {
                    setActiveDayButton(activeDayBtn);
                    renderDaySchedule(getCurrentWeekType(), currentDayOfWeek);
                }
            });
        }

        // Функция переключения активных кнопок дней
        function setActiveDayButton(activeButton) {
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            activeButton.classList.add('active');
        }

        // Когда страница загрузится
        document.addEventListener('DOMContentLoaded', function() {
            // Находим кнопку текущего дня
            const activeDayBtn = document.querySelector(`.day-btn[data-day="${currentDayOfWeek}"]`);
            
            if (activeDayBtn) {
                setActiveDayButton(activeDayBtn);
            }
            
            // Показываем расписание на сегодня
            renderDaySchedule(currentWeekType, currentDayOfWeek);

            // Обработчики для кнопок дней
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const dayIndex = parseInt(this.getAttribute('data-day'));
                    setActiveDayButton(this);
                    renderDaySchedule(getCurrentWeekType(), dayIndex);
                });
            });

            // Обработчик для кнопки полного расписания недели
            document.getElementById('fullWeekBtn').addEventListener('click', function() {
                document.querySelectorAll('.day-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                renderFullWeekSchedule();
            });

            // Адаптация при изменении размера окна
            window.addEventListener('resize', function() {
                const activeBtn = document.querySelector('.day-btn.active');
                if (activeBtn) {
                    const dayIndex = parseInt(activeBtn.getAttribute('data-day'));
                    renderDaySchedule(getCurrentWeekType(), dayIndex);
                }
            });
        });

        // Принудительное обновление кэша
        if (window.location.search.indexOf('v=') === -1) {
            window.location.search = '?v=' + Date.now();
        }
    </script>
</body>
</html>
